services:
    db:
      image: postgres
      restart: always
      environment:
        POSTGRES_PASSWORD: test
        POSTGRES_USER: test
        POSTGRES_DATABASE: transaction
      ports:
        - "5432:5432"
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5
